<!DOCTYPE html>
<html>

<head>
  <title>Sports Website Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
    }

    .header {
      background-color: #222;
      color: white;
      padding: 30px;
    }

    .content {
      padding: 40px;
    }

    .card {
      background: white;
      width: 300px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Sports World</h1>
    <p>Welcome to my first website!</p>
  </div>

  <div class="content">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=600" alt="Football">
      <h2>Football</h2>
      <p>Football is one of the most popular sports in the world.</p>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=600" alt="Basketball">
      <h2>Basketball</h2>
      <p>Basketball is played by millions of people worldwide.</p>
    </div>

  </div>

</body>

</html>
